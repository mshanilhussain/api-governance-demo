openapi: 3.1.0

info:
  title: "Warehouse API"
  version: 1.0.0
  description: "API for retrieving warehouse details. Managed through automated API governance."

servers:
  - url: https://api.example.com/v1

security:
  - bearerAuth: []

paths:
  /warehouses:
    get:
      summary: Retrieve warehouses
      operationId: getWarehouses
      description: Retrieves a list of warehouses.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Warehouses retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - name
                  properties:
                    id:
                      type: integer
                      example: 101
                    name:
                      type: string
                      example: Central Warehouse
        '401':
          description: Unauthorized - missing or invalid bearer token.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer