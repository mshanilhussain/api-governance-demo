openapi: 3.1.0

info:
  title: Inventory API
  version: 1.0.0
  description: API for retrieving inventory item details. Managed through automated API governance. Sync verification.

servers:
  - url: https://api.example.com/v1

security:
  - bearerAuth: []

paths:
  /inventory:
    get:
      summary: Retrieve inventory items
      operationId: getInventory
      description: Retrieves a list of inventory items.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Inventory items retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - name
                    - quantity
                  properties:
                    id:
                      type: integer
                      example: 101
                    name:
                      type: string
                      example: Laptop
                    quantity:
                      type: integer
                      example: 25
        '401':
          description: Unauthorized - missing or invalid bearer token.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer