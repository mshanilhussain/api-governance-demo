openapi: 3.1.0

info:
  title: "Management Live Demo API"
  version: 1.0.0
  description: "Live demo of Automated API Governance."

servers:
  - url: https://api.example.com/v1

security:
  - bearerAuth: []

paths:
  /status:
    get:
      operationId: getStatus
      summary: Get Service status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Service is unavailable

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer