openapi: 3.1.0
info:
  title: Governance Creation Demo API
  version: 1.0.0
  description: Demonstrates automated Postman collection creation during API governance.
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
paths:
  /creation-demo:
    get:
      summary: Retrieve collection creation demo status
      operationId: getCreationDemoStatus
      description: Returns a sample status for the collection creation demonstration.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Demo status retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: operational
        '401':
          description: Unauthorized - missing or invalid bearer token.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
