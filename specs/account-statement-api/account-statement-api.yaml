openapi: 3.1.0

info:
  title: "Account Statement API"
  version: 1.0.0
  description: "Account Statements for customers"

servers:
  - url: https://api.example.com/v1

security:
  - bearerAuth: []

paths:
  /statements:
    get:
      operationId: listStatements
      summary: List Account Statements
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of Account Statements
        "401":
          description: Missing or invalid access token

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer