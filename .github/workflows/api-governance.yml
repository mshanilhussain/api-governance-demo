name: API Governance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Postman OWASP Governance
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: >-
            spec lint specs/customer-api/customer-api.yaml
            --workspace-id 8a87b18c-244c-44fb-abe1-c48362546372
            --fail-severity ERROR
          api-key: ${{ secrets.POSTMAN_API_KEY }}

      - name: Generate Postman Collection
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: >-
            spec generate collection specs/customer-api/customer-api.yaml
            --name "Customer API" --force
            --workspace 8a87b18c-244c-44fb-abe1-c48362546372
          api-key: ${{ secrets.POSTMAN_API_KEY }}