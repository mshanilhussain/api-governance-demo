name: API Governance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Postman OWASP Governance
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: >-
            spec lint specs/customer-api/customer-api.yaml
            --workspace-id 8a87b18c-244c-44fb-abe1-c48362546372
            --fail-severity ERROR
          api-key: ${{ secrets.POSTMAN_API_KEY }}

      - name: Update Postman Cloud Specification
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman spec file update \
            4565be34-c889-4b9e-9059-8905b9cd0180 \
            index.yaml \
            < specs/customer-api/customer-api.yaml

      - name: Generate Postman Cloud Collection
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman spec generate collection \
            4565be34-c889-4b9e-9059-8905b9cd0180 \
            --name "Customer API" \
            --workspace 8a87b18c-244c-44fb-abe1-c48362546372
