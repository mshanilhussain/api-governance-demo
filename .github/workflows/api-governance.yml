name: API Governance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for Spectral
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint OpenAPI specifications
        shell: bash
        run: |
          mapfile -t SPECS < <(
            find specs -type f \( -name '*.yaml' -o -name '*.yml' \) | sort
          )

          if [ "${#SPECS[@]}" -eq 0 ]; then
            echo "No YAML specifications found."
            exit 0
          fi

          for spec in "${SPECS[@]}"; do
            echo "Linting: $spec"
            npx --yes @stoplight/spectral-cli lint \
              --ruleset .spectral-auth-demo.yaml "$spec"
          done

      - name: Validate API Governance Catalogue
        run: python scripts/validate-governance.py

      - name: Detect changed API
        id: api
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          API_FILE=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" \
            | grep '^specs/.*/.*\.yaml$' \
            | head -n 1)

          if [ -z "$API_FILE" ]; then
            echo "No API specification changed."
            echo "api_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          API_NAME=$(echo "$API_FILE" | cut -d'/' -f2)

          echo "API file: $API_FILE"
          echo "API name: $API_NAME"

          echo "api_changed=true" >> "$GITHUB_OUTPUT"
          echo "api_file=$API_FILE" >> "$GITHUB_OUTPUT"
          echo "api_name=$API_NAME" >> "$GITHUB_OUTPUT"

      - name: Get Postman Spec ID
        if: steps.api.outputs.api_changed == 'true'
        id: mapping
        run: |
          SPEC_ID=$(awk -v api="${{ steps.api.outputs.api_name }}" '
            $1 == api ":" {
              found=1
              next
            }
            found && /spec_id:/ {
              gsub(/"/, "", $2)
              print $2
              exit
            }
          ' .postman/api-mappings.yaml)

          if [ -z "$SPEC_ID" ]; then
            echo "No Postman Spec ID found for API: ${{ steps.api.outputs.api_name }}"
            exit 1
          fi

          echo "Postman Spec ID: $SPEC_ID"
          echo "spec_id=$SPEC_ID" >> "$GITHUB_OUTPUT"

      - name: Run Postman OWASP Governance
        if: steps.api.outputs.api_changed == 'true'
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: >-
            spec lint ${{ steps.api.outputs.api_file }}
            --workspace-id 8a87b18c-244c-44fb-abe1-c48362546372
            --fail-severity ERROR
          api-key: ${{ secrets.POSTMAN_API_KEY }}

      - name: Update Postman Cloud Specification
        if: github.event_name == 'push' && steps.api.outputs.api_changed == 'true'
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman spec file update \
            "${{ steps.mapping.outputs.spec_id }}" \
            index.yaml \
            < "${{ steps.api.outputs.api_file }}"

      - name: Generate Postman Cloud Collection
        if: github.event_name == 'push' && steps.api.outputs.api_changed == 'true'
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman spec generate collection \
            "${{ steps.mapping.outputs.spec_id }}" \
            --name "${{ steps.api.outputs.api_name }}" \
            --workspace 8a87b18c-244c-44fb-abe1-c48362546372