name: API Governance

on:
  push:
    branches:
      - main
    paths:
      - "specs/**/*.yaml"
      - "specs/**/*.yml"
      - "governance/**"
      - "tests/**"
      - "scripts/**"
      - ".postman/**"
      - ".spectral-auth-demo.yaml"
      - ".github/workflows/api-governance.yml"
  pull_request:
    branches:
      - main
    paths:
      - "specs/**/*.yaml"
      - "specs/**/*.yml"
      - "governance/**"
      - "tests/**"
      - "scripts/**"
      - ".postman/**"
      - ".spectral-auth-demo.yaml"
      - ".github/workflows/api-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate API specifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Spectral
        run: |
          npm install --global @stoplight/spectral-cli

      - name: Validate OpenAPI specifications
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SPECS < <(
            find specs -type f \( -name '*.yaml' -o -name '*.yml' \) | sort
          )

          if [ "${#SPECS[@]}" -eq 0 ]; then
            echo "No YAML specifications found."
            exit 0
          fi

          for spec in "${SPECS[@]}"; do
            echo "Linting: $spec"
            spectral lint \
              --ruleset .spectral-auth-demo.yaml \
              "$spec"
          done

      - name: Validate governance configuration
        run: |
          python scripts/validate-governance.py

  detect-changes:
    name: Detect changed APIs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Detect changed APIs and resolve mappings
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BASE="$HEAD_SHA"
          else
            BASE="$BEFORE_SHA"
          fi

          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          MATRIX="$(python scripts/detect-changed-apis.py "$BASE" "$HEAD_SHA")"

          echo "Detected API matrix:"
          echo "$MATRIX"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          HAS_CHANGES="$(python -c '
          import json, sys
          data = json.load(sys.stdin)
          print(str(any(not item.get("skip", False) for item in data["include"])).lower())
          ' <<< "$MATRIX")"

          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "Changed API specifications detected: $HAS_CHANGES"

  postman-governance:
    name: Postman governance
    runs-on: ubuntu-latest
    needs:
      - validate
      - detect-changes

    if: >-
      needs.detect-changes.outputs.has_changes == 'true' &&
      (github.event_name == 'push' ||
       github.event_name == 'pull_request')

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Postman CLI
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://dl-cli.pstmn.io/install/linux64.sh" | sh
          postman --version

      - name: Lint OpenAPI specification with Postman
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail
          postman spec lint "${{ matrix.api_file }}"

      - name: Discover existing generated collection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: existing_collection
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail

          COLLECTION_ID="$(python scripts/find-postman-collection.py \
            "${{ matrix.spec_id }}" \
            "${{ matrix.api_name }}")"

          echo "collection_id=$COLLECTION_ID" >> "$GITHUB_OUTPUT"

          if [ -n "$COLLECTION_ID" ]; then
            echo "Existing collection found: $COLLECTION_ID"
          else
            echo "No existing collection found for ${{ matrix.api_name }}."
          fi

      - name: Update Postman Cloud Specification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail

          postman spec file update \
            "${{ matrix.spec_id }}" \
            index.yaml \
            < "${{ matrix.api_file }}"

      - name: Generate initial Postman collection
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.existing_collection.outputs.collection_id == ''
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail

          echo "Generating initial collection for ${{ matrix.api_name }}"

          postman spec generate collection \
            "${{ matrix.spec_id }}" \
            --name "${{ matrix.api_name }}" \
            --workspace 8a87b18c-244c-44fb-abe1-c48362546372

      - name: Discover newly generated collection
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.existing_collection.outputs.collection_id == ''
        id: new_collection
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail

          COLLECTION_ID=""

          for attempt in 1 2 3 4 5 6; do
            echo "Collection discovery attempt $attempt of 6"

            COLLECTION_ID="$(python scripts/find-postman-collection.py \
              "${{ matrix.spec_id }}" \
              "${{ matrix.api_name }}")"

            if [ -n "$COLLECTION_ID" ]; then
              break
            fi

            if [ "$attempt" -lt 6 ]; then
              echo "Collection not visible yet. Waiting 10 seconds..."
              sleep 10
            fi
          done

          if [ -z "$COLLECTION_ID" ]; then
            echo "::error::Unable to discover the generated collection for ${{ matrix.api_name }} after 6 attempts."
            exit 1
          fi

          echo "collection_id=$COLLECTION_ID" >> "$GITHUB_OUTPUT"
          echo "New collection discovered: $COLLECTION_ID"

      - name: Synchronize Postman collection with specification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail

          COLLECTION_ID="${{ steps.existing_collection.outputs.collection_id }}"

          if [ -z "$COLLECTION_ID" ]; then
            COLLECTION_ID="${{ steps.new_collection.outputs.collection_id }}"
          fi

          if [ -z "$COLLECTION_ID" ]; then
            echo "::error::No collection ID available for synchronization."
            exit 1
          fi

          echo "Synchronizing ${{ matrix.api_name }} using collection $COLLECTION_ID"

          postman spec sync collection \
            "${{ matrix.spec_id }}" \
            --collection-id "$COLLECTION_ID"