
name: API Governance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Spectral
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint OpenAPI specifications
        shell: bash
        run: |
          mapfile -t SPECS < <(
            find specs -type f \( -name '*.yaml' -o -name '*.yml' \) | sort
          )

          if [ "${#SPECS[@]}" -eq 0 ]; then
            echo "No YAML specifications found."
            exit 0
          fi

          for spec in "${SPECS[@]}"; do
            echo "Linting: $spec"
            npx --yes @stoplight/spectral-cli lint \
              --ruleset .spectral-auth-demo.yaml "$spec"
          done

      - name: Validate API Governance Catalogue
        run: python scripts/validate-governance.py

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed APIs and resolve mappings
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi

          MATRIX=$(python scripts/detect-changed-apis.py \
            "$BASE_SHA" "${{ github.sha }}")

          echo "Detected API matrix:"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  postman-governance:
    needs:
      - validate
      - detect-changes
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        if: matrix.skip != true
        uses: actions/checkout@v4

      - name: Install Python
        if: matrix.skip != true
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Postman CLI
        if: matrix.skip != true
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://dl-cli.pstmn.io/install/linux64.sh | sh
          postman --version

      - name: Run Postman specification governance
        if: matrix.skip != true
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman spec lint "${{ matrix.api_file }}" \
            --workspace-id 8a87b18c-244c-44fb-abe1-c48362546372 \
            --fail-severity ERROR

      # Discover the existing collection BEFORE updating the specification.
      # This lets us use its current synchronization state to identify it.
      - name: Discover existing generated collection
        id: discover
        if: github.event_name == 'push' && matrix.skip != true
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        shell: bash
        run: |
          COLLECTION_ID="$(
            python scripts/find-postman-collection.py \
              "${{ matrix.spec_id }}" \
              "${{ matrix.api_name }}"
          )"

          echo "collection_id=$COLLECTION_ID" >> "$GITHUB_OUTPUT"

          if [ -n "$COLLECTION_ID" ]; then
            echo "Existing collection discovered: $COLLECTION_ID"
          else
            echo "No generated collection exists yet. It will be created once."
          fi

      # Only create a collection when the specification has none.
      - name: Generate initial Postman collection
        if: github.event_name == 'push' && matrix.skip != true && steps.discover.outputs.collection_id == ''
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman spec generate collection \
            "${{ matrix.spec_id }}" \
            --name "${{ matrix.api_name }}" \
            --workspace 8a87b18c-244c-44fb-abe1-c48362546372

      # Resolve the ID of the newly created collection.
      - name: Discover newly generated collection
        id: discover-created
        if: github.event_name == 'push' && matrix.skip != true && steps.discover.outputs.collection_id == ''
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        shell: bash
        run: |
          COLLECTION_ID="$(
            python scripts/find-postman-collection.py \
              "${{ matrix.spec_id }}" \
              "${{ matrix.api_name }}"
          )"

          if [ -z "$COLLECTION_ID" ]; then
            echo "ERROR: Collection generation completed, but no matching collection was found."
            exit 1
          fi

          echo "collection_id=$COLLECTION_ID" >> "$GITHUB_OUTPUT"
          echo "New collection discovered: $COLLECTION_ID"

      - name: Update Postman Cloud Specification
        if: github.event_name == 'push' && matrix.skip != true
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman spec file update \
            "${{ matrix.spec_id }}" \
            index.yaml \
            < "${{ matrix.api_file }}"

      # Sync the existing collection rather than generating another one.
      - name: Synchronize Postman collection with specification
        if: github.event_name == 'push' && matrix.skip != true
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          COLLECTION_ID: ${{ steps.discover.outputs.collection_id || steps.discover-created.outputs.collection_id }}
        run: |
          if [ -z "$COLLECTION_ID" ]; then
            echo "ERROR: No Postman collection ID was resolved."
            exit 1
          fi

          echo "Synchronizing collection: $COLLECTION_ID"
          postman spec sync collection \
            "${{ matrix.spec_id }}" \
            --collection-id "$COLLECTION_ID"

          echo "Postman collection synchronization command completed."