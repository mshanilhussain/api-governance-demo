name: API Governance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Spectral
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint OpenAPI specifications
        shell: bash
        run: |
          mapfile -t SPECS < <(
            find specs -type f \( -name '*.yaml' -o -name '*.yml' \) | sort
          )

          if [ "${#SPECS[@]}" -eq 0 ]; then
            echo "No YAML specifications found."
            exit 0
          fi

          for spec in "${SPECS[@]}"; do
            echo "Linting: $spec"
            npx --yes @stoplight/spectral-cli lint \
              --ruleset .spectral-auth-demo.yaml "$spec"
          done

      - name: Validate API Governance Catalogue
        run: |
          python scripts/validate-governance.py

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed APIs and resolve mappings
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi

          MATRIX=$(python scripts/detect-changed-apis.py \
            "$BASE_SHA" "${{ github.sha }}")

          echo "Detected API matrix:"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  postman-governance:
    needs:
      - validate
      - detect-changes
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        if: matrix.skip != true
        uses: actions/checkout@v4

      - name: Install Postman CLI
        if: matrix.skip != true
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://dl-cli.pstmn.io/install/linux64.sh | sh
          postman --version

      - name: Run Postman OWASP Governance
        if: matrix.skip != true
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman spec lint "${{ matrix.api_file }}" \
            --workspace-id 8a87b18c-244c-44fb-abe1-c48362546372 \
            --fail-severity ERROR

      - name: Update Postman Cloud Specification
        if: github.event_name == 'push' && matrix.skip != true
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman spec file update \
            "${{ matrix.spec_id }}" \
            index.yaml \
            < "${{ matrix.api_file }}"

      - name: Generate Postman Cloud Collection
        if: github.event_name == 'push' && matrix.skip != true
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman spec generate collection \
            "${{ matrix.spec_id }}" \
            --name "${{ matrix.api_name }}" \
            --workspace 8a87b18c-244c-44fb-abe1-c48362546372
